<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chessmate</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell app-container">
      <header class="topbar app-header" aria-label="Game header">
        <a class="brand" href="/" aria-label="Chessmate home">
          <div>
            <div class="brand-logo-wrapper">
              <span class="brand-icon" aria-hidden="true">♛</span>
              <h2 class="brand-title">Chessmate</h2>
            </div>
            <p class="brand-author">by Ethan</p>
          </div>
        </a>
        <button class="icon-button share-button btn-share" id="copyLinkButton" title="Share room" aria-label="Share room">
          <span aria-hidden="true">Share Room</span>
        </button>
      </header>

      <section class="home-view main-layout" id="homeView">
        
        <section class="home-copy hero-section relative">
          <div id="start-screen" class="flex flex-col gap-4 absolute z-50 bg-[#F5F1E7] p-10 rounded-xl shadow-lg w-[400px]">
              
              <h1 class="text-5xl font-bold text-gray-900 mb-2">One room.<br>One board.<br>No clutter.</h1>

              <div class="flex gap-2">
                  <button id="btn-create-mode" class="bg-red-500 text-white px-4 py-2 rounded-md font-bold shadow-sm transition">Create Room</button>
                  <button id="btn-join-mode" class="bg-white border border-gray-300 text-gray-800 px-4 py-2 rounded-md font-bold hover:bg-gray-50 transition">Join Room</button>
                  <button id="btn-play-bot" class="bg-white border border-gray-300 text-gray-800 px-4 py-2 rounded-md font-bold hover:bg-gray-50 transition">Play Bot</button>
              </div>

              <div id="create-options-panel" class="flex flex-col gap-4 mt-2">
                  <div class="flex items-center gap-3">
                      <span class="text-gray-700 font-semibold text-sm">Room Visibility:</span>
                      <label class="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" id="private-toggle" class="sr-only peer">
                          <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-500"></div>
                          <span id="toggle-label" class="ml-2 text-sm font-medium text-gray-900">Public Room</span>
                      </label>
                  </div>

                  <div class="flex items-center gap-3">
                      <span class="text-gray-700 font-semibold text-sm">Play As:</span>
                      <div class="flex gap-2">
                          <button data-color="white" class="color-pick bg-white border border-gray-400 text-black px-2 py-1 rounded text-sm font-bold active-pick shadow-sm">White</button>
                          <button data-color="black" class="color-pick bg-gray-800 text-white px-2 py-1 rounded text-sm font-bold opacity-50 hover:opacity-100 transition">Black</button>
                          <button data-color="random" class="color-pick bg-gray-200 text-gray-800 px-2 py-1 rounded text-sm font-bold opacity-50 hover:opacity-100 transition">Random</button>
                      </div>
                  </div>

                  <button id="btn-confirm-create" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-md font-bold mt-2 transition shadow-sm">Start Match</button>
              </div>

              <div id="join-options-panel" class="hidden flex-col gap-4 mt-2">
                  
                  <div class="bg-white border border-gray-300 rounded-md p-3">
                      <h3 class="font-bold text-gray-800 text-sm mb-2">Search Public Rooms</h3>
                      <div id="public-rooms-list" class="flex flex-col gap-2 max-h-40 overflow-y-auto pr-1">
                          <p class="text-gray-400 text-xs italic">No active public rooms. Create one!</p>
                      </div>
                  </div>

                  <div class="flex gap-2">
                      <input type="text" id="private-code-input" placeholder="Private room code" class="border border-gray-300 p-2 rounded-md text-sm flex-1 focus:outline-none focus:border-red-400">
                      <button id="btn-confirm-join-private" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-md text-sm font-bold transition shadow-sm">Join Code</button>
                  </div>
              </div>
          </div>
        </section>
        <section class="board-section">
          <div class="preview-board chessboard-container" id="previewBoard" aria-hidden="true"></div>
        </section>
      </section>

      <section class="game-view hidden" id="gameView">
        <aside class="side-panel player-panel top-player" id="blackPanel">
          <div>
            <p class="panel-label">Black</p>
            <h2 id="blackStatus">Waiting</h2>
          </div>
          <div class="captured" id="whiteCaptures"></div>
        </aside>

        <section class="board-wrap" aria-label="Chess board area">
          <div class="room-strip">
            <div>
              <p class="panel-label">Room</p>
              <strong id="roomName">--</strong>
            </div>
            <div class="turn-pill" id="turnPill">Connecting</div>
          </div>
          <div class="board" id="board" aria-label="Chess board"></div>
        </section>

        <aside class="side-panel player-panel bottom-player" id="whitePanel">
          <div>
            <p class="panel-label">White</p>
            <h2 id="whiteStatus">Waiting</h2>
          </div>
          <div class="captured" id="blackCaptures"></div>
        </aside>

        <section class="side-panel game-panel">
          <div>
            <p class="panel-label">You are</p>
            <h2 id="roleLabel">Joining</h2>
          </div>
          <div class="status-box" id="statusBox">Connecting to the room...</div>
          <div class="control-row">
            <button class="secondary-button" id="resetButton">Reset</button>
            <button class="secondary-button" id="copyLinkButtonPanel">Copy Link</button>
          </div>
          <div class="control-row">
            <button class="secondary-button" id="drawButton">Offer Draw</button>
            <button class="secondary-button danger-button" id="resignButton">Resign</button>
          </div>
          <div class="moves" id="movesList" aria-label="Move list"></div>
        </section>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
    <audio id="moveSound" src="/move.mp3"></audio>
    <audio id="captureSound" src="/capture.mp3"></audio>
    <audio id="checkSound" src="/check.mp3"></audio>
  </body>
</html>
